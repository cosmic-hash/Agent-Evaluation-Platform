services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agent_eval
      POSTGRES_USER: eval
      POSTGRES_PASSWORD: eval
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eval -d agent_eval"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

  migrate:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://eval:eval@db:5432/agent_eval
    command: alembic upgrade head
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql+psycopg://eval:eval@db:5432/agent_eval
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  worker:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://eval:eval@db:5432/agent_eval
      WORKER_POLL_SECONDS: "1"
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: python -m app.worker

volumes:
  postgres_data:
